name: build

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup nix
        uses: ./.github/actions/setup-nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: build public-cache darwin configuration
        run: |
          nix build --quiet --out-link result .#darwinConfigurations.aarch64-public.system
      - name: upload to cache
        uses: ./.github/actions/upload-cache
      - name: generate closure snapshot
        run: |
          nix run --inputs-from . nixpkgs#dix -- snapshot ./result > snapshot.json
      - name: upload closure snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshot.json
          retention-days: 90

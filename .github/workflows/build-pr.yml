name: build-pr

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - '*'

jobs:
  build-pr:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup nix
        uses: ./.github/actions/setup-nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: build PR head
        run: |
          nix build --quiet --out-link result .#darwinConfigurations.aarch64-public.system
      - name: upload to cache
        uses: ./.github/actions/upload-cache
      - name: download main snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run=$(gh run list --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if ! gh run download "$run" --name snapshot; then
            git checkout main
            before=$(nix build --quiet --no-link --print-out-paths .#darwinConfigurations.aarch64-public.system)
            git checkout ${{ github.sha }}
            nix run --inputs-from . nixpkgs#dix -- snapshot "$before" > snapshot.json
          fi
      - name: generate package diff
        run: |
          set -euo pipefail
          {
            echo "## Package Changes"
            echo ""
            echo '```'
            nix run --inputs-from . nixpkgs#dix -- --color never diff snapshot.json ./result
            echo '```'
          } > package-changes.md
      - name: comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --body "$(cat package-changes.md)"

name: build-pr

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - '*'

jobs:
  build-pr:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::792172458894:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: get signing key
        run: |
          secret=$(aws secretsmanager get-secret-value \
            --secret-id /nix/cache/signing-key \
            --query SecretString \
            --output text)
          private_key=$(echo "$secret" | jq -r '.privateKey')
          public_key=$(echo "$secret" | jq -r '.publicKey')
          echo "::add-mask::${private_key}"
          echo "$private_key" > private-key
          chmod 600 private-key
          echo "PUBLIC_KEY=${public_key}" >> "$GITHUB_ENV"
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          install_url: https://releases.nixos.org/nix/nix-2.28.4/install
          extra_nix_config: |
            trusted-public-keys = ${{ env.PUBLIC_KEY }} cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://nix.barney.dev/ https://cache.nixos.org/
            download-buffer-size = 1073741824
            max-substitution-jobs = 32
      - name: restore nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-main-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-main-
      - name: build main
        run: |
          set -euo pipefail
          git checkout main
          before=$(nix build --quiet --no-link --print-out-paths .#darwinConfigurations.aarch64-public.system)
          echo "BEFORE=$before" >> "$GITHUB_ENV"
      - name: build PR head
        run: |
          set -euo pipefail
          git checkout ${{ github.sha }}
          nix build --quiet --out-link result .#darwinConfigurations.aarch64-public.system
      - name: assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::792172458894:role/github-actions
          role-session-name: GitHubActions-${{ github.run_id }}
      - name: sign and upload to cache
        run: |
          nix store sign --verbose --key-file ./private-key --recursive ./result
          nix copy --quiet --max-jobs auto --to "s3://nix.barney.dev?region=us-east-2" ./result
          echo "successfully uploaded to cache at s3://nix.barney.dev"
      - name: generate package diff
        run: |
          set -euo pipefail
          {
            echo "## Package Changes"
            echo ""
            echo '```'
            nix run --inputs-from . nixpkgs#dix -- --color never "$BEFORE" ./result
            echo '```'
          } > package-changes.md
      - name: comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.number }} --body "$(cat package-changes.md)"
